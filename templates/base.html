<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}داخلی‌های هتل{% endblock %}</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet"><link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet"></head><body><nav class="navbar navbar-expand-lg navbar-dark"><div class="container"><a class="navbar-brand" href="{{ url_for('index') }}">✦ هتل‌فون</a><div class="ms-auto d-flex gap-2 align-items-center">{% if current_user.is_authenticated %}<a class="nav-link" href="{{ url_for('admin') }}">مدیریت</a><a class="btn btn-light btn-sm" href="{{ url_for('logout') }}">خروج</a>{% else %}<a class="btn btn-light btn-sm" href="{{ url_for('login') }}">ورود مدیر</a>{% endif %}</div></div></nav><main class="container py-4 py-lg-5">{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">{{ message }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>{% block scripts %}{% endblock %}</body></html>

{% extends 'base.html' %}
{% block title %}ورود مدیریت{% endblock %}
{% block content %}
<div class="login-box">
  <div class="login-head">
    <span class="login-mark" aria-hidden="true">✦</span>
    <div>
      <p class="eyebrow">پنل مدیریت</p>
      <h2>خوش آمدید</h2>
    </div>
  </div>
  <p class="text-muted">برای مدیریت دفترچه داخلی‌ها وارد شوید.</p>
  <form method="post" data-loading>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="form-label" for="username">نام کاربری</label>
    <input class="form-control mb-3" id="username" name="username" autocomplete="username" required autofocus>
    <label class="form-label" for="password">رمز عبور</label>
    <input type="password" class="form-control mb-4" id="password" name="password" autocomplete="current-password" required>
    <button type="submit" class="btn btn-primary w-100" data-loading-text="در حال ورود...">ورود به پنل</button>
  </form>
</div>
{% endblock %}
